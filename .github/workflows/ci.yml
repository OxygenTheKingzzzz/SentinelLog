name: ci

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sentinellog
          POSTGRES_PASSWORD: sentinellog
          POSTGRES_DB: sentinellog
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sentinellog -d sentinellog"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      SENTINELLOG_TEST_DATABASE_URL: postgresql+psycopg://sentinellog:sentinellog@127.0.0.1:5432/sentinellog_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Create the test database
        run: |
          python - <<'PY'
          import psycopg
          with psycopg.connect(
              "postgresql://sentinellog:sentinellog@127.0.0.1:5432/sentinellog",
              autocommit=True,
          ) as conn:
              row = conn.execute(
                  "SELECT 1 FROM pg_database WHERE datname = 'sentinellog_test'"
              ).fetchone()
              if row is None:
                  conn.execute("CREATE DATABASE sentinellog_test OWNER sentinellog")
          PY
      - name: Ruff
        run: ruff check src tests
      - name: Pytest
        run: pytest

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        run: npm ci
      - name: Vitest
        run: npm test
      - name: Vite build
        run: npm run build
