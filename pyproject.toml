[project]
name = "sentinellog"
version = "0.5.0"
description = "Local SOC / Linux log intelligence platform. Milestone 5 adds optional read-only file tailing."
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.14",
    "fastapi>=0.115",
    "psycopg[binary]>=3.2",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "python-dotenv>=1.0",
    "python-multipart>=0.0.12",
    "scikit-learn>=1.5",
    "sqlalchemy>=2.0.36",
    "uvicorn>=0.32",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27",
    "pytest>=8.3",
    "ruff>=0.8",
]

[project.scripts]
sentinellog = "sentinellog.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"src/sentinellog/api/routes.py" = ["B008"]
"src/sentinellog/detection/routes.py" = ["B008"]
"src/sentinellog/ml/routes.py" = ["B008"]
"src/sentinellog/investigations/routes.py" = ["B008"]
"src/sentinellog/live/routes.py" = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
